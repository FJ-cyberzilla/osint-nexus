[mypy]
python_version = 3.13
strict = True
plugins = pydantic.mypy

# Maximum 'Any' restriction rules
disallow_any_unimported = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_expr = True

# Directory exclusions
exclude = build

# Overrides for third-party modules lacking type stubs
[mypy-curl_cffi.*]
ignore_missing_imports = True
follow_imports = silent

[mypy-PyQt6.*]
ignore_missing_imports = True
follow_imports = silent

[mypy-playwright.*]
ignore_missing_imports = True
follow_imports = silent

[mypy-imagehash.*]
ignore_missing_imports = True
follow_imports = silent

[mypy-rapidfuzz.*]
ignore_missing_imports = True
follow_imports = silent
