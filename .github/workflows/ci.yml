name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install and Build via Makefile
      run: make install

    - name: Run Tests via Makefile
      run: make test

    - name: Run Linter via Makefile
      run: make lint

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -exclude-dir=testdata ./...

    - name: Check File Size
      run: |
        find internal pkg -type f -name "*.go" -print0 |
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")

            if [ "$lines" -gt 800 ]; then
              echo "Error: $file exceeds 800 lines ($lines lines)"
              exit 1
            elif [ "$lines" -gt 500 ]; then
              echo "Warning: $file exceeds 500 lines ($lines lines)"
            fi
          done
