name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -exclude-dir=testdata ./...

    - name: Check File Size
      run: |
        find internal pkg -name "*.go" -exec wc -l {} + | awk '
        $1 > 800 { print "Error: " $2 " exceeds 800 lines"; exit 1 }
        $1 > 500 { print "Warning: " $2 " exceeds 500 lines" }'
