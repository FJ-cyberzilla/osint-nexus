name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # Restrict to only the main repository
    if: github.repository == 'FJ-cyberzilla/osint-nexus'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run tests with pytest-xdist
        # Run tests in parallel across vCPUs.
        run: uv run pytest -n auto --durations=10

  complexity:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Check complexity
        run: |
          # Use radon to find functions with CC > 4.
          # Complexity check: radon cc --min B identifies functions with CC >= 6.
          # We fail the build if such functions exist to enforce maintainability.
          uv run radon cc osint_nexus/ -s -n B && exit 1 || echo "Complexity check passed (no functions with CC >= 6)"
