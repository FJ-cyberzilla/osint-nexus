[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osint_nexus"
version = "2.0.1"
description = "High-performance OSINT username finder"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "FJ-cyberzilla", email = "cyberzilla.systems@gmail.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "curl_cffi>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "imagehash>=4.3.0",
    "Pillow>=10.0.0",
    "rapidfuzz>=3.5.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # "ruff>=0.15.22",
]

[tool.setuptools]
packages = ["osint_nexus"]

# ===== RUFF CONFIGURATION =====
[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # bugbear
    "I",   # isort
    "C",   # complexity
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # unused variable in tests
"__init__.py" = ["F401"]  # unused import (re-exported)

[tool.ruff.lint.isort]
known-first-party = ["osint_nexus"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== PYTEST =====
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# ===== MYPY CONFIGURATION =====
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["build"]
# Per-module overrides for problematic libraries or files
[[tool.mypy.overrides]]
module = ["curl_cffi.*", "httpx.*"]
ignore_missing_imports = true
follow_imports = "skip"
