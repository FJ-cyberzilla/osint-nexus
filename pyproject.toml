[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osint_nexus"
version = "2.0.1"
description = "High-performance OSINT username finder"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "FJ-cyberzilla", email = "cyberzilla.systems@gmail.com" }
]
maintainers = [
    { name = "FJ-cyberzilla", email = "cyberzilla.systems@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.22",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/FJ-cyberzilla/osint_nexus"
Repository = "https://github.com/FJ-cyberzilla/osint_nexus.git"
Issues = "https://github.com/FJ-cyberzilla/osint_nexus/issues"

[tool.setuptools]
packages = ["osint_nexus"]

# ===== RUFF CONFIGURATION =====
[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # bugbear
    "I",   # isort
    "C",   # complexity
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F841",  # unused variable (common in tests)
]
"__init__.py" = [
    "F401",  # unused import (re-exported)
]

[tool.ruff.lint.isort]
known-first-party = ["osint_nexus"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ===== PYTEST CONFIGURATION =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"

# ===== COVERAGE CONFIGURATION =====
[tool.coverage.run]
source = ["osint_nexus"]
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80
