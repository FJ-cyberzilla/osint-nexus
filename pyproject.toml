[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osint_nexus"
version = "3.1.7"
description = "High-performance OSINT username finder"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "FJ-cyberzilla", email = "cyberzilla.systems@gmail.com" }
]

# Core dependencies (Pure Python / Universal) - Works natively on Termux, Linux, Windows, macOS
dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.7.0",
    "textual>=8.2.8",
    "tqdm>=4.66.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/FJ-cyberzilla/osint-nexus"
Repository = "https://github.com/FJ-cyberzilla/osint-nexus.git"
"Bug Tracker" = "https://github.com/FJ-cyberzilla/osint-nexus/issues"

[project.optional-dependencies]
# C-accelerated networking, fuzzy matching, and image hashing
speedups = [
    "curl_cffi>=0.7.0",
    "rapidfuzz>=3.5.0",
    "imagehash>=4.3.0",
    "Pillow>=10.0.0",
]

# Desktop GUI features
gui = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
]

# Headless browser automation
browser = [
    "playwright>=1.40.0",
]

# All-in-one target for Desktop Linux / Workstations
full = [
    "osint_nexus[speedups,gui,browser]",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["osint_nexus"]

# ===== RUFF CONFIGURATION =====
[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # bugbear
    "I",   # isort
    "C",   # complexity
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
"__init__.py" = ["F401"]
"tests/test_network.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["osint_nexus"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== PYTEST =====
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# ===== MYPY CONFIGURATION =====
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["build"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["curl_cffi.*", "httpx.*"]
ignore_missing_imports = true
follow_imports = "skip"
